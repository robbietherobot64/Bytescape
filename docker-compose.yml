# Local development services: Postgres + MinIO (S3-compatible storage)
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose down -v  (destroy data volumes)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bytescape
      POSTGRES_PASSWORD: bytescape
      POSTGRES_DB: bytescape
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
