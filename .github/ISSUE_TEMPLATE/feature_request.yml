name: Feature request
description: Propose an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature scope is shaped against VISION.md and ROADMAP.md. Describe the
        problem first — the design gets agreed in the issue before any code is
        written, so don't open a PR yet.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or pain does this address? Who feels it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Sketch the behavior, not the code.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, or workarounds you use today.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / migration
        - Feed
        - Profiles
        - Federation (AT Protocol / ActivityPub)
        - Events / community
        - Self-hosting / operations
        - Other
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: A handle or email if we need to follow up with you.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I read VISION.md and this fits the direction of the project.
          required: true