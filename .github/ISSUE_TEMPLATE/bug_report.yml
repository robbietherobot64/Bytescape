name: Bug report
description: Something is broken or behaves wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more precisely you describe what you did and
        what happened, the faster it gets fixed. Security issues go to
        admin@bytescape.social instead — not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected behavior vs. actual behavior.
      placeholder: When I do X, I expect Y, but Z happens instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Which instance (bytescape.social, another host, local dev), browser/OS, and roughly when it happened.
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: A handle or email if we need to follow up with you.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability (those go to admin@bytescape.social).
          required: true