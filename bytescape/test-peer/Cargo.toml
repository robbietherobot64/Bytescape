[package]
name = "test-peer"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2"
iroh = { version = "0.96.1", features = ["address-lookup-pkarr-dht", "address-lookup-mdns"] }
iroh-docs = "0.96.0"
iroh-blobs = "0.98.0"
iroh-gossip = "0.96.0"
tokio = { version = "1.49.0", features = ["full"] }
rand = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
