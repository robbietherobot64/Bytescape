[package]
name = "bytescape"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "bytescape"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bytescape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
getrandom = { version = "0.2", features = ["js"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
iroh = { version = "0.96.1", features = ["address-lookup-pkarr-dht", "address-lookup-mdns"] }
iroh-docs = "0.96.0"
iroh-blobs = "0.98.0"
iroh-gossip = "0.96.0"
irpc = "0.12.0"
pkarr = "5.0.2"
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.101"
thiserror = "2.0"
url = "2.5.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
hex = { version = "0.4.3", features = ["serde"] }
rand = "0.9"
dirs = "6.0.0"
redb = "3.1.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
bytes = "1"
zip = "4"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.8.0"
blake3 = "1"
urlencoding = "2.1.3"
regex = "1"
infer = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
data-encoding = "2.10"
bs58 = "0.5"
warp = { version = "0.4.2", features = ["server"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
yrs = "0.25"

# AT Protocol OAuth & API
atrium-api = "0.25"
atrium-common = "0.1"
atrium-oauth = { version = "0.1", features = ["default-client"] }
atrium-identity = "0.1"
atrium-xrpc = "0.12"

# GTK overlay support for browser webviews on Linux
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3.10"
zip = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
