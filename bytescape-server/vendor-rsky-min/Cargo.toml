[workspace]
members = [
    "palomar-sync",
    "rsky-common",
    "rsky-crypto",
    "rsky-firehose",
    "rsky-identity",
    "rsky-lexicon",
    "rsky-repo",
    "rsky-syntax",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.160", features = ["derive"] }
serde_derive = "^1.0"
serde_ipld_dagcbor = { version = "0.6.1", features = ["codec"] }
lexicon_cid = { package = "cid", version = "0.11.1", features = ["serde-codec"] }
ipld-core = "0.4.2"
serde_cbor = "0.11.2"
serde_bytes = "0.11.15"
tokio = { version = "1.28.2", features = ["full"] }
tokio-util = "0.7"
sha2 = "0.10.8"
rand = "0.8.5"
rand_core = "0.6.4"
secp256k1 = { version = "0.28.2", features = ["global-context", "serde", "rand", "hashes", "rand-std"] }
serde_json = { version = "1.0.96", features = ["preserve_order"] }
rsky-lexicon = { path = "rsky-lexicon" }
rsky-identity = { path = "rsky-identity" }
rsky-crypto = { path = "rsky-crypto" }
rsky-syntax = { path = "rsky-syntax" }
rsky-common = { path = "rsky-common" }
rsky-repo = { path = "rsky-repo" }
rsky-firehose = { path = "rsky-firehose" }

[profile.release]
debug = 2
